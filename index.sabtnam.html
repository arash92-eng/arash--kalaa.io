<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
<div id="li" class="container">
    <div class="row mt-5">
        <div class="col-12">
                <div style="width: 43%" class="card d-block m-auto shadow-sm p-3">
                    <h3 class="card-title text-center">ثبت نام</h3>
                    <div>

                        <label class="form-label" for="a"></label>
                        <input placeholder="نام ونام خانوادگی" class="form-control mb-2 p-1" id="a" type="text">
                        <label id="inner" class="form-label" for="b"></label>
                        <input onkeyup="key2()" placeholder="شماره تلفن" class="form-control mb-2 p-1" id="b"
                               type="text">
                        <div class="d-flex gap-2">
                            <div class="w-50">
                                <label id="innerr" class="form-label" for="c"></label>
                                <input onkeyup="key3()" placeholder="رمز عبور(حداقل 8 جرف)"
                                       class="form-control mb-2 p-1" id="c" type="password">
                            </div>

                            <div class="w-50">
                                <label id="innerrr" class="form-label" for="d"></label>
                                <input onkeyup="key4()" placeholder="تکرار رمز عبور" class="form-control mb-2 p-1"
                                       id="d" type="password">
                            </div>
                        </div>
                        <div class="d-flex">
                            <div class="w-75">
                                <label id="qqq" class="form-label" for="da"></label>
                                <input onkeyup="key5()" placeholder="رمز امنیتی" class="form-control mb-2 p-1" id="da"
                                       type="text">
                            </div>
                            <div id="random" class="w-25 m-4 p-1 text-center border border-dark">
                            </div>
                        </div>
                        <div class="form-check d-flex justify-content-center align-items-center form-switch mb-3">
                            <input class="form-check-input ms-2" id="x" type="checkbox">
                            <label class="form-check-label" for="x">
                                همه
                                <a class="text-decoration-none" href="">قوانین و شرایط</a>
                                را خوانده و می‌پذیرم
                            </label>
                        </div>
                        <button onclick="sabtnam()" id="lll" class="btn btn-primary w-100">ثبت نام</button>

                        <p class="mt-3 d-flex justify-content-center ">قبلا ثبت نام کردید?
                            <a class="text-decoration-none" href="index-login.html">ورود</a>
                        </p>

                    </div>
                </div>
        </div>
    </div>
</div>
<script src="js.js"></script>
</body>
</html>
