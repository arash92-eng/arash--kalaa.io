<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>arash market</title>
    <link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
<div class="container">
    <div class="row mt-5">
        <div class="col-12">
            <form action="">
                <div style="width: 43%" class="card d-block m-auto shadow-sm p-3">
                    <h3 class="card-title text-center">ثبت نام</h3>
                    <div>
                        <label class="form-label" for="a"></label>
                        <input placeholder="نام ونام خانوادگی" class="form-control mb-2 p-1" id="a" type="text">
                        <label class="form-label" for="b"></label>
                        <input placeholder="شماره تلفن" class="form-control mb-2 p-1" id="b" type="text"minlength="11" maxlength="11">
                        <label class="form-label" for="c"></label>
                        <input placeholder="رمز عبور" class="form-control mb-2 p-1" id="c" type="password">
                        <label class="form-label" for="d"></label>
                        <input placeholder="تکرار رمز عبور" class="form-control mb-2 p-1" id="d" type="password">

                        <div class="form-check d-flex justify-content-center align-items-center form-switch mb-3">
                            <input class="form-check-input ms-2" id="x" type="checkbox">
                            <label class="form-check-label" for="x">
                                همه
                                <a class="text-decoration-none" href="">قوانین و شرایط</a>
                                را خوانده و می‌پذیرم
                            </label>
                        </div>
                        <button class="btn btn-primary w-100">ثبت نام</button>

                        <p class="mt-3 d-flex justify-content-center ">قبلا ثبت نام کردید?
                            <a  class="text-decoration-none" href="index-login.html">ورود</a>
                        </p>

                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
